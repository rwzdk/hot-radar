name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/snapshot.json'
  pull_request:

permissions:
  contents: read

concurrency:
  group: hot-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 九榜快照完整性
        run: npm run snapshot:check

      - name: 生产构建
        run: npm run build
